<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="Feb8.css">
</head>
<body>

<div class="calculator">
    <label for="display" class="display-label">Js Calculator</label>
    <label for="display1" class="display-label">Shivohaam</label>
    <input type="text" id="display1" disabled>
    <input type="text" id="display" disabled>


    <div class="buttons">
        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button onclick="calculate()">=</button>
        
        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button onclick="soperator('+')">+</button>
        
        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button onclick="soperator('-')">−</button>

        <button onclick="clearDisplay()">Clear</button>
        <button onclick="soperator('-')">−</button>
        <button onclick="soperator('%')">%</button>
        <button onclick="soperator('/')">÷</button>
        <button onclick="soperator('*')">×</button>
        
        
        <button class="zero" onclick="add('0')">0</button>
        <button onclick="add('.')">.</button>
    </div>
</div>

<script src="Feb8.js"></script>
</body>
</html>
